<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 784" width="720" height="1568" role="img" aria-label="ECG 数据完整性检测流水线：上位机经 UART 送入 300 Hz 心电数据，中断里解析帧并写入环形缓冲，按记录切窗口，快照后交给工作线程，提取 6 维特征，SVM 推理，只有有效窗口通过 BLE 发送。">
	<style>
		text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; text-anchor: middle; }
		.title { font-size: 15px; font-weight: 600; fill: #f4f4f5; }
		.sub { font-size: 12px; fill: #a1a1aa; }
		.edge { font-size: 12px; fill: #a1a1aa; }
		.edge-yes { font-size: 12px; fill: #93c5fd; }
		.flow { fill: none; stroke: #71717a; stroke-width: 1.5; }
		.flow-yes { fill: none; stroke: #60a5fa; stroke-width: 1.5; }
		.flow-no { fill: none; stroke: #52525b; stroke-width: 1.5; stroke-dasharray: 4 4; }
	</style>
	<defs>
		<marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
			<path d="M1 1L6.5 4L1 7" fill="none" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
		</marker>
		<marker id="arrow-yes" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
			<path d="M1 1L6.5 4L1 7" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
		</marker>
		<marker id="arrow-no" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
			<path d="M1 1L6.5 4L1 7" fill="none" stroke="#52525b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
		</marker>
	</defs>
	<rect width="360" height="784" fill="#09090b" />
	<rect x="24" y="20" width="312" height="58" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" />
	<text x="180" y="45" class="title">上位机</text>
	<text x="180" y="67" class="sub">UART · 300 Hz 心电数据</text>
	<path d="M180 82V94" class="flow" marker-end="url(#arrow)" />
	<rect x="24" y="100" width="312" height="58" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" />
	<text x="180" y="125" class="title">UART 中断</text>
	<text x="180" y="147" class="sub">解析数据帧</text>
	<path d="M180 162V174" class="flow" marker-end="url(#arrow)" />
	<rect x="24" y="180" width="312" height="58" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" />
	<text x="180" y="205" class="title">环形缓冲</text>
	<text x="180" y="227" class="sub">数据入队</text>
	<path d="M180 242V254" class="flow" marker-end="url(#arrow)" />
	<rect x="24" y="260" width="312" height="76" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" />
	<text x="180" y="285" class="title">按记录切窗口</text>
	<text x="180" y="307" class="sub">最长 12000 点</text>
	<text x="180" y="325" class="sub">典型 9000 点 = 30 s</text>
	<path d="M180 340V352" class="flow" marker-end="url(#arrow)" />
	<rect x="24" y="358" width="312" height="58" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" />
	<text x="180" y="383" class="title">快照 → 工作线程</text>
	<text x="180" y="405" class="sub">采集不被阻塞</text>
	<path d="M180 420V432" class="flow" marker-end="url(#arrow)" />
	<rect x="24" y="438" width="312" height="76" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" />
	<text x="180" y="463" class="title">特征提取</text>
	<text x="180" y="485" class="sub">三段 × 峰度、偏度</text>
	<text x="180" y="503" class="sub">共 6 维特征</text>
	<path d="M180 518V530" class="flow" marker-end="url(#arrow)" />
	<rect x="24" y="536" width="312" height="58" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" />
	<text x="180" y="561" class="title">模型推理</text>
	<text x="180" y="583" class="sub">SVM · 约 1 ms</text>
	<path d="M119 598V610" class="flow" marker-end="url(#arrow)" />
	<path d="M119 616L185 650L119 684L53 650Z" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" stroke-linejoin="round" />
	<text x="119" y="655" class="title">有效？</text>
	<rect x="228" y="630" width="108" height="40" rx="10" fill="none" stroke="#3f3f46" stroke-dasharray="4 4" />
	<text x="282" y="655" class="sub">丢弃，不上传</text>
	<path d="M189 650H222" class="flow-no" marker-end="url(#arrow-no)" />
	<text x="206.5" y="641" class="edge">否</text>
	<path d="M119 688V700" class="flow-yes" marker-end="url(#arrow-yes)" />
	<text x="139" y="700" class="edge-yes">是</text>
	<rect x="24" y="706" width="190" height="58" rx="10" fill="rgba(96,165,250,0.08)" stroke="rgba(96,165,250,0.55)" />
	<text x="119" y="731" class="title">BLE 发送</text>
	<text x="119" y="751" class="sub">START / DATA / END 分包</text>
</svg>
